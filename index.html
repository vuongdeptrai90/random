<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vương Hóng Hớt - Random Acc</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">


<style>

*{
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}


body{

margin:0;
min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

color:white;

background:
radial-gradient(circle at top,#00eaff55,transparent 40%),
linear-gradient(135deg,#030303,#151515,#222);

}


/* nền chuyển động */

body:before{

content:"";

position:absolute;

width:500px;
height:500px;

background:#00eaff;

filter:blur(180px);

opacity:.3;

animation:bgmove 8s infinite alternate;

}



@keyframes bgmove{

from{
transform:translate(-200px,-100px);
}

to{
transform:translate(200px,100px);
}

}



.box{


width:95%;

max-width:430px;

padding:30px;


background:

rgba(255,255,255,.08);


backdrop-filter:blur(15px);


border-radius:25px;


border:1px solid rgba(255,255,255,.2);


box-shadow:

0 0 40px #00eaff55;


text-align:center;


animation:show .7s;


}



@keyframes show{

from{

opacity:0;

transform:translateY(50px);

}

to{

opacity:1;

transform:none;

}

}



.logo{

font-size:65px;

animation:float 2s infinite;

}


@keyframes float{

50%{

transform:translateY(-10px);

}

}



h1{

margin:5px;

font-size:30px;

color:#00eaff;


text-shadow:

0 0 20px #00eaff;

}



p{

color:#ddd;

}



select,
button{


width:100%;

padding:15px;

margin-top:15px;


border:none;

border-radius:15px;


font-size:16px;

}



select{


background:#111;

color:white;

border:1px solid #00eaff;


}



button{


background:

linear-gradient(45deg,#00eaff,#008cff);


font-weight:bold;

cursor:pointer;


box-shadow:

0 0 20px #00eaff;


transition:.3s;


}



button:hover{

transform:scale(1.05);

}



button:active{

transform:scale(.95);

}



button:disabled{


background:#555;

box-shadow:none;

}



.result{


display:none;

margin-top:20px;

padding:20px;


border-radius:20px;


background:

rgba(0,0,0,.45);


border:1px solid #00eaff;


animation:popup .5s;

}



@keyframes popup{


from{

opacity:0;

transform:scale(.7);

}


to{

opacity:1;

transform:scale(1);

}

}



.result p{


background:#111;

padding:10px;

border-radius:10px;


color:white;


}



.copy{


background:

linear-gradient(45deg,#00ff88,#00cc55);


box-shadow:

0 0 20px #00ff88;


}



#cooldown{

color:#ffd700;

font-weight:bold;

}



#count{

color:#00ff88;

font-size:22px;

font-weight:bold;

}


</style>

</head>



<body>


<div class="box">


<div class="logo">
🎁
</div>


<h1>
Vương Hóng Hớt
</h1>


<p>
🔥 Random Acc Liên Quân Miễn Phí 🔥
</p>



<select id="type">

<option value="all">
🎲 Tất cả acc
</option>

<option value="vip">
⭐ Acc VIP
</option>

<option value="normal">
🆓 Acc thường
</option>

</select>



<button id="randomBtn" onclick="randomAcc()">

🎁 RANDOM ACC NGAY

</button>


<p id="cooldown"></p>



<div class="result" id="result">


<p id="user"></p>

<p id="pass"></p>

<p id="rank"></p>

<p id="skin"></p>



<button class="copy" onclick="copyAcc()">

📋 COPY ACC

</button>



</div>



<p>

🎯 Đã random:

<span id="count">
0
</span>

lần

</p>



</div>



<script>


const accounts=[


{
user:"banamaka",
pass:"hoilamgi12",
rank:"Chiến Tướng",
skin:"200+ Skin",
type:"vip"
},


{
user:"nghiempro123z",
pass:"0813751686a",
rank:"Cao Thủ",
skin:"150+ Skin",
type:"vip"
},


{
user:"reaogamer",
pass:"rizqidn",
rank:"Kim Cương",
skin:"50 Skin",
type:"normal"
},


{
user:"phieulv5555",
pass:"khang110",
rank:"Bạch Kim",
skin:"30 Skin",
type:"normal"
}


];



let currentAcc="";


let count=
Number(localStorage.getItem("count"))||0;


document.getElementById("count").innerHTML=count;



const wait=
24*60*60*1000;



function randomAcc(){



let last=
localStorage.getItem("randomTime");


if(last && Date.now()-last < wait){


alert("⏳ Bạn đã random hôm nay rồi!");


startTimer();


return;


}



let type=
document.getElementById("type").value;



let list=
accounts.filter(a=>

type=="all" || a.type==type

);



let acc=
list[Math.floor(Math.random()*list.length)];



document.getElementById("user").innerHTML=
"👤 Tài khoản: "+acc.user;


document.getElementById("pass").innerHTML=
"🔑 Mật khẩu: "+acc.pass;


document.getElementById("rank").innerHTML=
"🏆 Rank: "+acc.rank;


document.getElementById("skin").innerHTML=
"🎭 Skin: "+acc.skin;



document.getElementById("result").style.display="block";



currentAcc=

"Tài khoản: "+acc.user+
"\nMật khẩu: "+acc.pass+
"\nRank: "+acc.rank+
"\nSkin: "+acc.skin;



localStorage.setItem(
"randomTime",
Date.now()
);



count++;


localStorage.setItem(
"count",
count
);



document.getElementById("count").innerHTML=count;



startTimer();



}




function copyAcc(){


navigator.clipboard.writeText(currentAcc);


alert("✅ Đã copy acc");


}




function startTimer(){


let timer=setInterval(()=>{


let last=
localStorage.getItem("randomTime");


let remain=
wait-(Date.now()-last);



if(remain<=0){


clearInterval(timer);


document.getElementById("randomBtn").disabled=false;


document.getElementById("randomBtn").innerHTML=
"🎁 RANDOM ACC NGAY";


document.getElementById("cooldown").innerHTML=
"✅ Có thể random lại";


return;

}



let h=
Math.floor(remain/3600000);


let m=
Math.floor((remain%3600000)/60000);


let s=
Math.floor((remain%60000)/1000);



document.getElementById("cooldown").innerHTML=

"⏳ Còn lại: "
+h+" giờ "
+m+" phút "
+s+" giây";



document.getElementById("randomBtn").disabled=true;


document.getElementById("randomBtn").innerHTML=
"⏳ ĐANG CHỜ";


},1000);


}




function check(){


let last=
localStorage.getItem("randomTime");


if(last && Date.now()-last < wait){

startTimer();

}


}


check();



</script>


</body>
</html>
