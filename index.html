<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vương Hóng Hớt - Random Acc</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#050505,#222);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.box{
    width:95%;
    max-width:430px;
    background:#151515;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 25px #000;
    text-align:center;
}

.logo{
    font-size:45px;
}

h1{
    color:#00eaff;
}

select,button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    font-size:16px;
}

select{
    background:#292929;
    color:white;
}

button{
    background:#00eaff;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#555;
    color:#aaa;
}

.result{
    display:none;
    margin-top:20px;
    background:#222;
    padding:18px;
    border-radius:15px;
    text-align:left;
}

.copy{
    background:#00ff88;
}

#cooldown{
    color:#ffd700;
}
</style>

</head>

<body>

<div class="box">

<div class="logo">🎁</div>

<h1>Vương Hóng Hớt</h1>

<p>Random Acc Liên Quân miễn phí</p>


<select id="type">

<option value="all">🎲 Tất cả acc</option>

<option value="vip">⭐ Acc VIP</option>

<option value="normal">🆓 Acc thường</option>

</select>


<button id="randomBtn" onclick="randomAcc()">
🎲 RANDOM ACC
</button>


<p id="cooldown"></p>


<div class="result" id="result">

<p id="user"></p>
<p id="pass"></p>
<p id="rank"></p>
<p id="skin"></p>

<button class="copy" onclick="copyAcc()">
📋 COPY ACC
</button>

</div>


<p>
Đã random:
<span id="count">0</span> lần
</p>


</div>


<script>


const accounts = [

{
user:"banamaka",
pass:"hoilamgi12",
rank:"Chiến Tướng",
skin:"200+ Skin",
type:"vip"
},

{
user:"nghiempro123z",
pass:"0813751686a",
rank:"Cao Thủ",
skin:"150+ Skin",
type:"vip"
},

{
user:"reaogamer",
pass:"rizqidn",
rank:"Kim Cương",
skin:"50 Skin",
type:"normal"
},

{
user:"phieulv5555",
pass:"khang110",
rank:"Bạch Kim",
skin:"30 Skin",
type:"normal"
}

];


let currentAcc="";


let count = Number(localStorage.getItem("count")) || 0;

document.getElementById("count").innerHTML=count;


const timeWait = 24*60*60*1000;



function randomAcc(){

let last = localStorage.getItem("randomTime");

let now = Date.now();


if(last && now-last < timeWait){

alert("⏳ Bạn đã nhận acc hôm nay!");

startTimer();

return;

}


let type = document.getElementById("type").value;


let list = accounts.filter(acc =>
type=="all" || acc.type==type
);


if(list.length==0){

alert("Không có acc loại này!");

return;

}


let acc = list[Math.floor(Math.random()*list.length)];



document.getElementById("user").innerHTML=
"👤 Tài khoản: "+acc.user;


document.getElementById("pass").innerHTML=
"🔑 Mật khẩu: "+acc.pass;


document.getElementById("rank").innerHTML=
"🏆 Rank: "+acc.rank;


document.getElementById("skin").innerHTML=
"🎭 Skin: "+acc.skin;


document.getElementById("result").style.display="block";



currentAcc =
"Tài khoản: "+acc.user+
"\nMật khẩu: "+acc.pass+
"\nRank: "+acc.rank+
"\nSkin: "+acc.skin;



localStorage.setItem(
"randomTime",
Date.now()
);



count++;

localStorage.setItem(
"count",
count
);


document.getElementById("count").innerHTML=count;


startTimer();

}




function copyAcc(){

navigator.clipboard.writeText(currentAcc);

alert("✅ Đã copy thông tin acc");

}




function startTimer(){


let timer=setInterval(()=>{


let last =
localStorage.getItem("randomTime");


if(!last){

clearInterval(timer);
return;

}


let remain =
timeWait-(Date.now()-last);



if(remain<=0){

clearInterval(timer);


document.getElementById("randomBtn").disabled=false;

document.getElementById("randomBtn").innerHTML=
"🎲 RANDOM ACC";


document.getElementById("cooldown").innerHTML=
"✅ Có thể random lại";


return;

}



let h=Math.floor(remain/3600000);

let m=Math.floor((remain%3600000)/60000);

let s=Math.floor((remain%60000)/1000);



document.getElementById("cooldown").innerHTML=
"⏳ Còn lại: "+h+" giờ "+m+" phút "+s+" giây";



document.getElementById("randomBtn").disabled=true;

document.getElementById("randomBtn").innerHTML=
"⏳ Đang chờ";


},1000);

}




function check(){

let last =
localStorage.getItem("randomTime");


if(last && Date.now()-last < timeWait){

startTimer();

}

}


check();


</script>

</body>
</html>
