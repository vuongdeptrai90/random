<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vương Hóng Hớt - Random Acc</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
min-height:100vh;
background:linear-gradient(135deg,#050505,#222);
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.box{
width:95%;
max-width:430px;
background:#151515;
padding:25px;
border-radius:20px;
box-shadow:0 0 25px #000;
text-align:center;
}

.logo{
font-size:45px;
}

h1{
color:#00eaff;
}

select,button{
width:100%;
padding:14px;
margin-top:12px;
border:0;
border-radius:12px;
font-size:16px;
}

select{
background:#292929;
color:white;
}

button{
background:#00eaff;
font-weight:bold;
cursor:pointer;
}

button:disabled{
background:#555;
color:#aaa;
}

.result{
display:none;
margin-top:20px;
background:#222;
padding:18px;
border-radius:15px;
text-align:left;
word-break: break-all;
}

.copy{
background:#00ff88;
}

#cooldown{
color:#ffd700;
margin-top:15px;
}

</style>
</head>

<body>

<div class="box">

<div class="logo">🎁</div>

<h1>Vương Hóng Hớt</h1>
<p>Random Acc Liên Quân miễn phí</p>

<select id="type">
<option value="all">🎲 Tất cả acc</option>
<option value="vip">⭐ Acc VIP</option>
<option value="normal">🆓 Acc thường</option>
</select>

<button id="randomBtn">🎲 RANDOM ACC</button>

<p id="cooldown"></p>

<div class="result" id="result">
<p id="user"></p>
<p id="pass"></p>
<p id="rank"></p>
<p id="skin"></p>

<button class="copy" id="copyBtn">📋 COPY ACC</button>
</div>

<p>
Đã random:
<span id="count">0</span>
lần
</p>

</div>

<!-- Tích hợp SDK Firebase Firestore -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Thông tin cấu hình Firebase thực tế của bạn
  const firebaseConfig = {
    apiKey: "AIzaSyBATvUF2PFDKDTq3MoJaxE3UG6N4RblsFk",
    authDomain: "random-acc-52cfa.firebaseapp.com",
    projectId: "random-acc-52cfa",
    storageBucket: "random-acc-52cfa.firebasestorage.app",
    messagingSenderId: "686912141314",
    appId: "1:686912141314:web:56b84e507658ec1ace4f1b",
    measurementId: "G-6RH4V675SB"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentAcc = "";
  let count = localStorage.getItem("count") || 0;
  document.getElementById("count").innerHTML = count;

  const timeWait = 24 * 60 * 60 * 1000; // Thời gian chờ 24 giờ

  // Hàm xử lý khi bấm nút RANDOM ACC
  async function randomAcc() {
    let now = Date.now();
    let last = localStorage.getItem("randomTime");

    if (last && now - last < timeWait) {
      alert("⏳ Bạn đã nhận acc hôm nay!");
      return;
    }

    const btn = document.getElementById("randomBtn");
    btn.disabled = true;
    btn.innerHTML = "⏳ Đang lấy dữ liệu...";

    try {
      // Lấy danh sách tài khoản từ collection 'accounts' trên Firestore
      const querySnapshot = await getDocs(collection(db, "accounts"));
      const accounts = [];
      querySnapshot.forEach((doc) => {
        accounts.push(doc.data());
      });

      if (accounts.length === 0) {
        alert("⚠️ Cơ sở dữ liệu hiện chưa có tài khoản nào!");
        btn.disabled = false;
        btn.innerHTML = "🎲 RANDOM ACC";
        return;
      }

      let type = document.getElementById("type").value;
      // Lọc danh sách nếu acc có trường type (vip/normal)
      let list = accounts.filter(a => type == "all" || a.type == type || !a.type);

      if (list.length === 0) {
        list = accounts; // Nếu không lọc được loại phù hợp thì lấy tất cả
      }

      // Chọn ngẫu nhiên 1 tài khoản
      let acc = list[Math.floor(Math.random() * list.length)];

      document.getElementById("user").innerHTML = "👤 Tài khoản: " + (acc.username || "Không có");
      document.getElementById("pass").innerHTML = "🔑 Mật khẩu: " + (acc.password || "Không có");
      document.getElementById("rank").innerHTML = "🏆 Rank: " + (acc.rank || "Ngẫu nhiên");
      document.getElementById("skin").innerHTML = "🎭 Skin: " + (acc.skin || "Ngẫu nhiên");

      document.getElementById("result").style.display = "block";

      currentAcc = "Tài khoản: " + acc.username +
        "\nMật khẩu: " + acc.password +
        "\nRank: " + (acc.rank || "Ngẫu nhiên") +
        "\nSkin: " + (acc.skin || "Ngẫu nhiên");

      localStorage.setItem("randomTime", Date.now());

      count++;
      localStorage.setItem("count", count);
      document.getElementById("count").innerHTML = count;

      startTimer();

    } catch (error) {
      console.error(error);
      alert("❌ Lỗi truy xuất dữ liệu từ Firebase! Mời bạn thử lại sau.");
      btn.disabled = false;
      btn.innerHTML = "🎲 RANDOM ACC";
    }
  }

  // Hàm đếm ngược thời gian
  function startTimer() {
    let timer = setInterval(() => {
      let last = localStorage.getItem("randomTime");
      let remain = timeWait - (Date.now() - last);

      if (remain <= 0) {
        clearInterval(timer);
        document.getElementById("randomBtn").disabled = false;
        document.getElementById("randomBtn").innerHTML = "🎲 RANDOM ACC";
        document.getElementById("cooldown").innerHTML = "✅ Có thể random lại";
        return;
      }

      let h = Math.floor(remain / 3600000);
      let m = Math.floor((remain % 3600000) / 60000);
      let s = Math.floor((remain % 60000) / 1000);

      document.getElementById("cooldown").innerHTML =
        "⏳ Còn lại: " + h + " giờ " + m + " phút " + s + " giây";

      document.getElementById("randomBtn").disabled = true;
      document.getElementById("randomBtn").innerHTML = "⏳ Đang chờ";
    }, 1000);
  }

  function check() {
    let last = localStorage.getItem("randomTime");
    if (last && Date.now() - last < timeWait) {
      startTimer();
    }
  }

  // Hàm Copy tài khoản
  function copyAcc() {
    if (!currentAcc) return;
    navigator.clipboard.writeText(currentAcc);
    alert("✅ Đã copy thông tin acc");
  }

  // Gắn sự kiện Click cho các nút bấm
  document.getElementById("randomBtn").addEventListener("click", randomAcc);
  document.getElementById("copyBtn").addEventListener("click", copyAcc);

  check();
</script>

</body>
</html>
