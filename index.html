<style>

*{
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
margin:0;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow-x:hidden;
color:white;
background:
radial-gradient(circle at top,#00eaff55,transparent 40%),
linear-gradient(135deg,#030303,#151515,#222);
padding:20px 0;
}

/* nền chuyển động */
body:before{
content:"";
position:absolute;
width:500px;
height:500px;
background:#00eaff;
filter:blur(180px);
opacity:.3;
animation:bgmove 8s infinite alternate;
}

@keyframes bgmove{
from{
transform:translate(-200px,-100px);
}
to{
transform:translate(200px,100px);
}
}

.box{
width:95%;
max-width:430px;
padding:30px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border-radius:25px;
border:1px solid rgba(255,255,255,.2);
box-shadow:0 0 40px #00eaff55;
text-align:center;
animation:show .7s;
position:relative;
z-index:1;
}

@keyframes show{
from{
opacity:0;
transform:translateY(50px);
}
to{
opacity:1;
transform:none;
}
}

.logo{
font-size:65px;
animation:float 2s infinite;
}

@keyframes float{
50%{
transform:translateY(-10px);
}
}

h1{
margin:5px;
font-size:30px;
color:#00eaff;
text-shadow:0 0 20px #00eaff;
}

p{
color:#ddd;
}

button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:15px;
font-size:16px;
background:linear-gradient(45deg,#00eaff,#008cff);
font-weight:bold;
cursor:pointer;
box-shadow:0 0 20px #00eaff;
transition:.3s;
color: white;
}

button:hover{
transform:scale(1.05);
}

button:active{
transform:scale(.95);
}

button:disabled {
background: #555 !important;
box-shadow: none !important;
cursor: not-allowed !important;
transform: none !important;
}

.result{
display:none;
margin-top:20px;
padding:20px;
border-radius:20px;
background:rgba(0,0,0,.45);
border:1px solid #00eaff;
animation:popup .5s;
}

@keyframes popup{
from{
opacity:0;
transform:scale(.7);
}
to{
opacity:1;
transform:scale(1);
}
}

.result p{
background:#111;
padding:10px;
border-radius:10px;
color:white;
word-break: break-all;
}

.copy{
background:linear-gradient(45deg,#00ff88,#00cc55);
box-shadow:0 0 20px #00ff88;
}

.stats-container {
margin-top: 15px;
display: flex;
justify-content: space-around;
background: rgba(0,0,0,0.3);
padding: 10px;
border-radius: 12px;
}

#count {
color:#00ff88;
font-size:20px;
font-weight:bold;
}

#remaining {
color:#00eaff;
font-size:20px;
font-weight:bold;
}

.reset-btn {
background: transparent;
border: 1px solid rgba(255,255,255,0.2);
color: #aaa;
font-size: 12px;
padding: 6px 12px;
margin-top: 15px;
box-shadow: none;
border-radius: 8px;
width: auto;
}

.reset-btn:hover {
background: rgba(255,255,255,0.1);
color: #fff;
transform: none;
}

/* KHU VỰC THÔNG TIN LIÊN HỆ */
.contact-section {
  margin-top: 25px;
  padding-top: 15px;
  border-top: 1px dashed rgba(255, 255, 255, 0.2);
}

.contact-title {
  font-size: 14px;
  color: #aaa;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.social-links {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.social-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 10px 15px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  transition: transform 0.3s, box-shadow 0.3s;
}

.social-btn.youtube {
  background: linear-gradient(45deg, #ff0000, #cc0000);
  color: white;
  box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
}

.social-btn.gmail {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.2);

.social-btn:hover {

}

.social-btn.youtube:hover {

}

.social-btn.gmail:hover {
  background: rgba(255, 255, 255, 0.2);
  border-color: #00eaff;

// Nạp danh sách còn dở dang từ bộ nhớ trình duyệt (nếu có)
let savedAccounts = localStorage.getItem("remainingAccounts");
let accounts = savedAccounts ? JSON.parse(savedAccounts) : [...defaultAccounts];

let currentAcc = "";
let count = Number(localStorage.getItem("count")) || 0;

// Hiển thị giao diện lúc khởi chạy
updateUI();

function randomAcc(){
  if (accounts.length === 0) {
    alert("⚠️ Đã hết tài khoản trong hệ thống!");
    return;
  }

  // Lấy ngẫu nhiên 1 acc và rút khỏi danh sách
  let randomIndex = Math.floor(Math.random() * accounts.length);
  let acc = accounts.splice(randomIndex, 1)[0];

  // Hiển thị kết quả
  document.getElementById("user").innerHTML = "👤 Tài khoản: " + acc.user;
  document.getElementById("pass").innerHTML = "🔑 Mật khẩu: " + (acc.pass ? acc.pass : "(Không có mật khẩu)");
  document.getElementById("result").style.display = "block";

  currentAcc = "Tài khoản: " + acc.user + "\nMật khẩu: " + acc.pass;

  // Cập nhật số lượt bấm và lưu mảng acc còn lại vào bộ nhớ trình duyệt
  count++;
  localStorage.setItem("count", count);
  localStorage.setItem("remainingAccounts", JSON.stringify(accounts));

  // Cập nhật lại giao diện ngay
  updateUI();
}

function updateUI() {
  document.getElementById("count").innerHTML = count;
  document.getElementById("remaining").innerHTML = accounts.length;

  let btn = document.getElementById("randomBtn");
  if (accounts.length === 0) {
    btn.disabled = true;
    btn.innerText = "❌ ĐÃ HẾT ACC";
  } else {
    btn.disabled = false;
    btn.innerText = "🎁 RANDOM ACC NGAY";
  }
}

function copyAcc(){
  if (!currentAcc) return;
  navigator.clipboard.writeText(currentAcc);
  alert("✅ Đã copy acc");
}

function resetData() {
  if (confirm("Bạn có muốn nạp lại kho 100 acc ban đầu không?")) {
    accounts = [...defaultAccounts];
    localStorage.setItem("remainingAccounts", JSON.stringify(accounts));
    document.getElementById("result").style.display = "none";
    updateUI();
    alert("✅ Đã khôi phục lại kho acc!");
  }
}
