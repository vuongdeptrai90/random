to{

.box{
width:95%;

animation:show .7s;

@keyframes show{
from{
opacity:0;
transform:translateY(50px);
}
to{
opacity:1;
transform:none;
}
}

.logo-img {
width: 100px;
height: 100px;

// Nạp danh sách còn dở dang từ bộ nhớ trình duyệt (nếu có)

let accounts = savedAccounts ? JSON.parse(savedAccounts) : [...defaultAccounts];

let currentAcc = "";
let count = Number(localStorage.getItem("count")) || 0;

// Hiển thị giao diện lúc khởi chạy
updateUI();

function randomAcc(){
  if (accounts.length === 0) {
    alert("⚠️ Đã hết tài khoản trong hệ thống!");
    return;
  }

  // Lấy ngẫu nhiên 1 acc và rút khỏi danh sách
  let randomIndex = Math.floor(Math.random() * accounts.length);
  let acc = accounts.splice(randomIndex, 1)[0];

  // Hiển thị kết quả
  document.getElementById("user").innerHTML = "👤 Tài khoản: " + acc.user;
  document.getElementById("pass").innerHTML = "🔑 Mật khẩu: " + (acc.pass ? acc.pass : "(Không có mật khẩu)");
  document.getElementById("result").style.display = "block";

  currentAcc = "Tài khoản: " + acc.user + "\nMật khẩu: " + acc.pass;

  // Cập nhật số lượt bấm và lưu mảng acc còn lại vào bộ nhớ trình duyệt
  count++;
  localStorage.setItem("count", count);
  localStorage.setItem("remainingAccounts", JSON.stringify(accounts));

  // Cập nhật lại giao diện ngay
  updateUI();
}

function updateUI() {
  document.getElementById("count").innerHTML = count;
  document.getElementById("remaining").innerHTML = accounts.length;

  let btn = document.getElementById("randomBtn");
  if (accounts.length === 0) {
    btn.disabled = true;
    btn.innerText = "❌ ĐÃ HẾT ACC";
  } else {
    btn.disabled = false; 
    btn.innerText = "🎁 RANDOM ACC NGAY";
  }
}

function copyAcc(){
  if (!currentAcc) return;
  navigator.clipboard.writeText(currentAcc);
  alert("✅ Đã copy acc");
}

function resetData() {
  if (confirm("Bạn có muốn nạp lại kho acc ban đầu không?")) {
    accounts = [...defaultAccounts];
    localStorage.setItem("remainingAccounts", JSON.stringify(accounts));
    document.getElementById("result").style.display = "none";
    updateUI();
    alert("✅ Đã khôi phục lại kho acc!");
  }
}
